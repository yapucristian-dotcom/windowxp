<div class="xp-toolbar">
  <button type="button" class="xp-nav-button" aria-label="Atrás" title="Atrás" (click)="back()">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="#3a8eef" stroke="#0831d9" />
      <path d="M14.2 7.4 8.4 12l5.8 4.6" fill="none" stroke="#ffffff" stroke-width="2" />
    </svg>
  </button>
  <button type="button" class="xp-nav-button" aria-label="Adelante" title="Adelante" (click)="forward()">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="#3a8eef" stroke="#0831d9" />
      <path d="M9.8 7.4 15.6 12l-5.8 4.6" fill="none" stroke="#ffffff" stroke-width="2" />
    </svg>
  </button>
  <button type="button" class="xp-nav-button" aria-label="Arriba" title="Arriba" (click)="up()">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="#5cb83a" stroke="#1d5c0c" />
      <path d="M12 16.2V8.2M8.2 11.4 12 7.6l3.8 3.8" fill="none" stroke="#ffffff" stroke-width="2" />
    </svg>
  </button>
  <span class="xp-toolbar-gap" aria-hidden="true"></span>
  <label class="xp-address">
    <span>Dirección</span>
    <input type="text" [value]="route()" readonly [attr.aria-label]="'Dirección de ' + title()" />
    <button type="button" class="xp-go" (click)="go()">Ir</button>
  </label>
</div>
